<!-- =====================================================================
  判定ロジック（純関数のみ・DOMを触らない。Nodeのテストからも読み込む）
===================================================================== -->
<script id="sousou-core">
globalThis.SousouCore = (function () {
  'use strict';

  function optionCodes(question) { return question.options.map(function (o) { return o.code; }); }

  // 回答コード配列 → 回答番号配列（0始まり）。不正な回答があれば null
  function toIndexes(answers, cfg) {
    var out = [];
    for (var q = 0; q < cfg.questions.length; q++) {
      var i = optionCodes(cfg.questions[q]).indexOf(answers ? answers[q] : undefined);
      if (i < 0) return null;
      out.push(i);
    }
    return out;
  }

  // 回答番号配列 → towns の番号（重み付き和を市町村数で割った余り）
  function slotOf(indexes, cfg) {
    var w = (cfg.rule && cfg.rule.weights) || [], n = cfg.towns.length, sum = 0;
    for (var i = 0; i < indexes.length; i++) sum += (w[i] || 0) * indexes[i];
    return ((sum % n) + n) % n;
  }

  // シート「市町村判定ルール」の組合せID（1〜768。Q5 がいちばん速く回る）
  function patternId(indexes, cfg) {
    var id = 0;
    for (var q = 0; q < indexes.length; q++) id = id * cfg.questions[q].options.length + indexes[q];
    return id + 1;
  }

  // 5問中4問が同じ隣接パターン（1問だけ別の選択肢に替えたもの）の主結果を数える。主結果と同じ市町村は数えない
  function neighborCounts(indexes, cfg) {
    var best = slotOf(indexes, cfg), counts = {};
    for (var q = 0; q < indexes.length; q++) {
      var n = cfg.questions[q].options.length;
      for (var alt = 0; alt < n; alt++) {
        if (alt === indexes[q]) continue;
        var copy = indexes.slice(); copy[q] = alt;
        var slot = slotOf(copy, cfg);
        if (slot !== best) counts[slot] = (counts[slot] || 0) + 1;
      }
    }
    return counts;
  }

  function townAt(cfg, slot, count) {
    var t = cfg.towns[slot];
    return { key: t.key, name: t.name, index: slot, town: t, count: count || 0 };
  }

  // 回答配列（回答コード×設問数）→ 主結果・あわせてチェックしたいまち2件・選んだ希望
  function calculate(answers, cfg) {
    var indexes = toIndexes(answers, cfg);
    if (!indexes) throw new Error('回答が揃っていません: ' + String(answers));
    var n = cfg.towns.length;
    var slot = slotOf(indexes, cfg);
    var counts = neighborCounts(indexes, cfg);
    var order = Object.keys(counts).map(Number).sort(function (a, b) {
      return counts[b] - counts[a] || ((a - slot + n) % n) - ((b - slot + n) % n);
    });
    var take = (cfg.rule && cfg.rule.runners) || 2;
    var runners = order.slice(0, take).map(function (x) { return townAt(cfg, x, counts[x]); });
    var reasons = cfg.questions.map(function (q, i) {
      var opt = q.options[indexes[i]];
      return { id: q.id, axis: q.axis, code: opt.code, label: opt.label };
    });
    return { best: townAt(cfg, slot, 0), runners: runners, reasons: reasons, slot: slot, indexes: indexes, key: answers.join('|'), patternId: patternId(indexes, cfg) };
  }

  // 全通りを列挙（回答番号配列の配列）
  function allIndexes(cfg) {
    var out = [];
    (function walk(prefix) {
      if (prefix.length === cfg.questions.length) { out.push(prefix); return; }
      var n = cfg.questions[prefix.length].options.length;
      for (var i = 0; i < n; i++) walk(prefix.concat(i));
    })([]);
    return out;
  }

  // 公平性の確認（シート「配点ルール」）＝主結果が各市町村に同数、候補の表示回数も同数、候補は主結果と重複しない
  function distribution(cfg) {
    var n = cfg.towns.length, primary = [], runner = [], problems = [];
    for (var i = 0; i < n; i++) { primary.push(0); runner.push(0); }
    var all = allIndexes(cfg);
    var take = (cfg.rule && cfg.rule.runners) || 2;
    all.forEach(function (indexes) {
      var answers = indexes.map(function (x, q) { return cfg.questions[q].options[x].code; });
      var r = calculate(answers, cfg);
      primary[r.slot]++;
      var seen = { }; seen[r.slot] = true;
      if (r.runners.length !== take) problems.push(r.key + ': 候補が' + r.runners.length + '件');
      r.runners.forEach(function (x) {
        if (seen[x.index]) problems.push(r.key + ': 候補が主結果または他の候補と重複');
        seen[x.index] = true; runner[x.index]++;
      });
    });
    var expectedPrimary = all.length / n, expectedRunner = all.length * take / n;
    cfg.towns.forEach(function (t, i) {
      if (primary[i] !== expectedPrimary) problems.push(t.name + ': 主結果 ' + primary[i] + '回（期待 ' + expectedPrimary + '）');
      if (runner[i] !== expectedRunner) problems.push(t.name + ': 候補表示 ' + runner[i] + '回（期待 ' + expectedRunner + '）');
    });
    return { total: all.length, primary: primary, runner: runner, expectedPrimary: expectedPrimary, expectedRunner: expectedRunner, problems: problems };
  }

  // CONFIG の整合性チェック。戻り値＝エラー文の配列（空なら正常）
  function validateConfig(cfg) {
    var errors = [];
    var qs = cfg.questions || [];
    var towns = cfg.towns || [];
    var rule = cfg.rule || {};
    if (qs.length !== 5) errors.push('questions は5問である必要があります（現在 ' + qs.length + '）');
    var product = 1;
    qs.forEach(function (q) {
      var codes = optionCodes(q);
      if (codes.length < 2 || codes.length > 4) errors.push(q.id + ': 選択肢は2〜4つ');
      if (new Set(codes).size !== codes.length) errors.push(q.id + ': 回答コードが重複しています');
      if (!q.title || !q.axis) errors.push(q.id + ': 設問文または診断軸が空です');
      q.options.forEach(function (o) { if (!o.code || !o.label) errors.push(q.id + ': 選択肢の code か label が空です'); });
      product *= codes.length;
    });
    if (towns.length !== 12) errors.push('towns は12市町村である必要があります（現在 ' + towns.length + '）');
    if (towns.length && product % towns.length !== 0) errors.push('回答の組み合わせ数 ' + product + ' が市町村数 ' + towns.length + ' で割り切れません（均等にならない）');
    if (!Array.isArray(rule.weights) || rule.weights.length !== qs.length) errors.push('rule.weights は設問数（' + qs.length + '）と同じ長さが必要です');
    else rule.weights.forEach(function (w, i) { if (typeof w !== 'number') errors.push('rule.weights[' + i + '] が数値ではありません'); });
    if (typeof rule.runners !== 'number' || rule.runners < 1 || rule.runners > towns.length - 1) errors.push('rule.runners は 1〜' + (towns.length - 1) + ' の数値');
    var keys = new Set();
    towns.forEach(function (t) {
      if (!t.key || keys.has(t.key)) errors.push((t.name || '?') + ': key が空か重複しています');
      keys.add(t.key);
      if (!t.name) errors.push(t.key + ': 市町村名が空です');
      ['consultUrl', 'officialUrl'].forEach(function (k) {
        if (!/^https:\/\//.test(t[k] || '')) errors.push(t.name + ': ' + k + ' は https:// で始まる必要があります');
      });
      if (!t.lead || !t.summary) errors.push(t.name + ': 結果見出しまたは紹介文が空です');
    });
    if (!errors.length) {
      var d = distribution(cfg);
      d.problems.forEach(function (p) { errors.push('公平性: ' + p); });
    }
    return errors;
  }

  // 文言のルール検査（「相双12市町村」表記／「里山」統一）。戻り値＝警告文の配列
  function lintCopy(cfg) {
    var warnings = [];
    collectStrings(cfg, '', function (path, text) {
      if (/^(lp|cta)\.(url|lineUrl)$|Url$/.test(path)) return;
      indexesOf(text, '12市町村').forEach(function (i) {
        if (text.slice(Math.max(0, i - 2), i) !== '相双') warnings.push(path + ': 「12市町村」は「相双12市町村」と書く → 「' + text + '」');
      });
      indexesOf(text, '山').forEach(function (i) {
        if (text.charAt(i - 1) !== '里') warnings.push(path + ': 「山」単独の表現。「里山」で統一する → 「' + text + '」');
      });
    });
    return warnings;
  }

  function indexesOf(text, needle) {
    var out = [], i = text.indexOf(needle);
    while (i >= 0) { out.push(i); i = text.indexOf(needle, i + 1); }
    return out;
  }

  function collectStrings(value, path, visit) {
    if (typeof value === 'string') { visit(path, value); return; }
    if (Array.isArray(value)) { value.forEach(function (v, i) { collectStrings(v, path + '[' + i + ']', visit); }); return; }
    if (value && typeof value === 'object') {
      Object.keys(value).forEach(function (k) { collectStrings(value[k], path ? path + '.' + k : k, visit); });
    }
  }

  return { calculate: calculate, slotOf: slotOf, patternId: patternId, toIndexes: toIndexes, allIndexes: allIndexes, distribution: distribution, validateConfig: validateConfig, lintCopy: lintCopy, collectStrings: collectStrings };
})();

<script id="sousou-app">
(function () {
  'use strict';
  var cfg = CONFIG;
  var core = SousouCore;
  var copy = cfg.copy;
  var doc = document;
  var $ = function (id) { return doc.getElementById(id); };
  var isEmbed = doc.documentElement.classList.contains('is-embed');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var params = new URLSearchParams(window.location.search);
  var session = Math.random().toString(36).slice(2, 10);
  var total = cfg.questions.length;

  var state = { screen: 'start', current: 0, answers: new Array(total).fill(null), result: null, busy: false };

  var el = {
    page: $('page'), card: $('card'), live: $('live'),
    progress: $('progress'), progressLabel: $('progress-label'), progressAxis: $('progress-axis'),
    progressCount: $('progress-count'), progressTrack: $('progress-track'), progressBar: $('progress-bar'),
    start: $('screen-start'), question: $('screen-question'), tally: $('screen-tally'), result: $('screen-result'),
    qLabel: $('q-label'), qTitle: $('q-title'), options: $('options'), back: $('back-button'), next: $('next-button'),
  };

  // ---- 文字の流し込み（すべて textContent。改行は \n のみ） ----
  function setText(id, text) { var node = $(id); if (node) node.textContent = text == null ? '' : String(text); }

    node.textContent = '';

  // ---- 静的文言 ----

    });

    setText('start-footnote', copy.startFootnote);
    setText('back-button', copy.backButton);
    setText('tally-text', copy.tally);
    setText('result-kicker', copy.resultKicker);
    setText('reasons-title', copy.reasonsTitle);
    setText('runners-title', copy.runnersTitle);
    setText('runners-note', copy.runnersNote);
    setText('restart-button', copy.restartButton);
    setLines($('disclaimer'), copy.disclaimer);
    setText('footer-text', '©' + cfg.app.copyrightYear + ' ' + cfg.app.operator);

  }
  function externalButton(a, label) {

    a.appendChild(srNote(copy.newTab));
  }

  // ---- 画面切替 ----

    setText('progress-axis', done ? '' : q.axis);

  // ---- 設問 ----
  function renderQuestion() {
    var q = cfg.questions[state.current];
    var chosen = state.answers[state.current];
    setText('q-label', q.id + '　' + q.axis);
    setText('q-title-text', q.title);
    el.options.textContent = '';
    q.options.forEach(function (opt, i) {
      var label = make('label', 'option' + (chosen === opt.code ? ' is-selected' : ''));
      var input = doc.createElement('input');

    showScreen('question');

    focusTo(el.qTitle);
    revealTop();
    afterRender();
  }

  function start() {
    if (state.busy) return;
    track('diagnosis_start', {});
    goQuestion(0, 'start');

  function next() {

    var code = state.answers[state.current];
    if (code == null) { el.next.disabled = true; return; }

    if (state.current < total - 1) { goQuestion(state.current + 1, 'next'); return; }
    finish();
  }

  function back() {
    if (state.busy || state.current === 0) return;
    goQuestion(state.current - 1, 'back');
  }

  function finish() {
    state.busy = true;
    showScreen('tally');
    announce(copy.tally);
    revealTop();
    afterRender();
    var delay = reduceMotion ? 0 : 650;
    setTimeout(function () {
      state.result = core.calculate(state.answers, cfg);
      renderResult(state.result);
      showScreen('result');
      setProgress(total, true);
      state.busy = false;
      announce('診断結果：' + state.result.best.name + '。あわせてチェックしたいまちは ' + state.result.runners.map(function (r) { return r.name; }).join('と') + '。');
      focusTo($('result-name'));
      revealTop();
      afterRender();
      track('diagnosis_complete', {
        result: state.result.best.key, result_name: state.result.best.name,
        runners: state.result.runners.map(function (r) { return r.key; }).join(','),
        pattern_id: state.result.patternId,
        answers: state.answers.join('|'),
      });
    }, delay);
  }

  function restart() {
    if (state.busy) return;
    state.answers = new Array(total).fill(null);
    state.result = null;
    track('diagnosis_restart', {});
    goQuestion(0, 'restart');
  }

  // ---- 結果 ----
  function renderResult(r) {

    setText('result-summary', t.summary);

      var row = make('div', 'reason-item');
      var dt = make('dt', null, item.axis); dt.setAttribute('data-q', item.id);
      row.appendChild(dt);
      row.appendChild(make('dd', null, item.label));
      list.appendChild(row);
    });
    $('reasons').hidden = r.reasons.length === 0;
    var consult = $('consult-link'); consult.href = t.consultUrl; consult.dataset.town = t.key;
    var official = $('official-link'); official.href = t.officialUrl; official.dataset.town = t.key;

    var runners = $('runner-list'); runners.textContent = '';
    r.runners.forEach(function (run) {
      var li = make('li', 'runner');
      var head = make('div', 'runner-head');
      head.appendChild(make('span', 'runner-name', run.town.name));
      var a = make('a', 'runner-link');
      a.href = run.town.consultUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.dataset.kind = 'runner_consult'; a.dataset.town = run.town.key;
      a.appendChild(doc.createTextNode(copy.runnerLink + ' ↗'));
      a.appendChild(srNote(copy.newTab));
      head.appendChild(a);
      li.appendChild(head);
      li.appendChild(make('p', 'runner-lead', run.town.lead));
      runners.appendChild(li);
    });

    renderSeminar();
  }

  function renderSeminar() {
    var box = $('seminar'), link = $('seminar-link');
    var mode = cfg.cta.seminar;
    var href = '';
    if (mode === 'lp' && cfg.lp.url) href = cfg.lp.url + (cfg.lp.seminarAnchor || '');
    if (mode === 'line' && cfg.cta.lineUrl) href = cfg.cta.lineUrl;
    if (!href) { box.hidden = true; return; }
    box.hidden = false;
    setText('seminar-badge', cfg.cta.eyebrow);
    setText('seminar-label', cfg.cta.label);
    setText('seminar-note', cfg.cta.note);
    link.href = href;
    link.textContent = '';
    link.classList.toggle('line', mode === 'line');
    link.dataset.kind = mode === 'line' ? 'line' : 'seminar';
    if (mode === 'line') {

    } else {

  // ---- 計測 ----
  function track(event, data) {

    var payload = { event: event, app: 'sousou_diagnosis', app_version: cfg.version, mode: isEmbed ? 'embed' : 'standalone', diag_session: session };
    Object.keys(data || {}).forEach(function (k) { payload[k] = data[k]; });
    if (cfg.analytics.pushToLocalDataLayer && Array.isArray(window.dataLayer)) { try { window.dataLayer.push(payload); } catch (e) {} }

  function loadClarity(id) {

  // ---- 埋め込み（親ページとの通信） ----

    var body = { source: 'sousou-diagnosis', v: 1 };

  }
  var lastHeight = 0;
  function measure() { return Math.ceil(el.page.getBoundingClientRect().height) + 1; }
  function sendHeight(force) {

    if ('ResizeObserver' in window) { new ResizeObserver(function () { sendHeight(); }).observe(el.page); }
    else { window.addEventListener('resize', function () { sendHeight(); }); }

    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () { sendHeight(true); });
  }

  // ---- セルフテスト（?selftest=1 または SOUSOU_DIAGNOSIS.selfTest()） ----
  function selfTest() {
    var results = [];
    function check(name, ok, detail) { results.push({ name: name, ok: !!ok, detail: detail || '' }); }
    var names = function (r) { return r.runners.map(function (x) { return x.name; }).join('・'); };
    var sizes = cfg.questions.map(function (q) { return q.options.length; });
    var product = sizes.reduce(function (a, b) { return a * b; }, 1);
    check('設定の形（5問・' + sizes.join('/') + '択・12市町村・' + product + '通り）', cfg.questions.length === 5 && cfg.towns.length === 12 && product === 768);
    // シート「テストケース」から抜粋（同数の候補の並びを含む）
    [
      ['urban|city|family|local_work|private', 1, '新地町', '南相馬市・相馬市'],
      ['urban|city|family|local_work|moderate', 2, '浪江町', '大熊町・葛尾村'],
      ['urban|city|family|remote|moderate', 8, '楢葉町', '相馬市・広野町'],
      ['balanced|city|community|local_work|private', 217, '南相馬市', '浪江町・葛尾村'],
      ['renewal|suburban|calm|entrepreneur|active', 768, '飯舘村', '広野町・新地町'],
    ].forEach(function (c) {
      var r = core.calculate(c[0].split('|'), cfg);
      check('TC-' + String(c[1]).padStart(3, '0') + ' ' + c[0], r.patternId === c[1] && r.best.name === c[2] && names(r) === c[3], r.best.name + '／候補 ' + names(r));
    });

    check('validateConfig', errors.length === 0, errors.join(' / '));

    check('lintCopy（相双12市町村・里山）', warnings.length === 0, warnings.join(' / '));

    var passed = results.filter(function (r) { return r.ok; }).length;

    var ul = make('ul');

    box.appendChild(ul);

  }

  // ---- 初期化 ----
  function init() {
    renderStatic();
    setupEmbed();
    loadClarity(cfg.analytics.clarityProjectId);
    var errors = core.validateConfig(cfg), warnings = core.lintCopy(cfg);
    if (errors.length && window.console) console.error('[SOUSOU移住診断] CONFIG エラー', errors);
    if (warnings.length && window.console) console.warn('[SOUSOU移住診断] 表記の警告', warnings);

    $('start-button').addEventListener('click', start);
    el.question.addEventListener('submit', function (e) { e.preventDefault(); next(); });
    el.back.addEventListener('click', back);
    $('restart-button').addEventListener('click', restart);
    el.result.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[data-kind]') : null;
      if (a) track('diagnosis_link_click', { kind: a.dataset.kind, town: a.dataset.town || (state.result ? state.result.best.key : '') });
    });

    showScreen('start');
    afterRender();
    if (!isEmbed && /^(1|true|yes)$/i.test(params.get('selftest') || '')) selfTest();
  }

  window.SOUSOU_DIAGNOSIS = { selfTest: selfTest, calculate: function (a) { return core.calculate(a, cfg); }, distribution: function () { return core.distribution(cfg); }, config: cfg, version: cfg.version };
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
